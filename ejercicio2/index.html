<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Verificador de Contraseña</title>
    <link rel="stylesheet" href="../style.css">
</head>
<body>
    <div class="container">
        <a href="../index.html" class="back-link">← Volver al inicio</a>
        <h2>Verificador de Contraseña</h2>
        <div class="form-group">
            <label for="password">Contraseña:</label>
            <input type="text" id="password" placeholder="Escribe una contraseña de prueba">
        </div>
        
        <button onclick="verificarPassword()">Verificar</button>

        <!-- El contenedor de resultados inicia oculto -->
        <div id="resultado" class="result" style="display: none;">
            <div id="rule-length" class="rule"></div>
            <div id="rule-digit" class="rule"></div>
            <div id="rule-space" class="rule"></div>
            <div id="final-message" style="margin-top: 1rem;"></div>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
